[project]
name = "embeddings-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pip>=25.3",
    "torch>=2.9.1",
    "xinference[embedding,rerank]>=1.15.0",
]


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
