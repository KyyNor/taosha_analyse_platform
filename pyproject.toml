    "requests>=2.32.5",
    "retry>=0.9.2",
    "sqlalchemy>=2.0.43",
    "sqlparse>=0.5.4",
    "tabulate>=0.9.0",
    "tiktoken>=0.11.0",
    "uvicorn>=0.35.0",
    "hypothesis>=6.100.0",
    "deepagents>=0.3.0",
    "python-multipart>=0.0.20",
    "pip>=25.3",
    "docker>=7.1.0",
    "browser-use>=0.11.2",
    "kafka-python>=2.3.0",
    "pyjwt>=2.10.1",
