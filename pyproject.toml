[project]
name = "taosha-analyse-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.0",
    "arize-phoenix>=12.6.1",
    "cachetools>=6.2.0",
    "diskcache>=5.6.3",
    "duckdb>=1.2.2",
    "fastapi>=0.116.1",
    "fastembed>=0.5.0",
    "httpx>=0.28.1",
    "jaydebeapi>=1.2.3",
    "langchain>=1.0.2",
    "langchain-openai>=1.0.1",
    "langfuse>=3.8.1",
    "langgraph>=1.0.1",
    "loguru>=0.7.3",
    "markitdown>=0.1.3",
    "numpy>=2.2.6",
    "openai>=2.6.0",
    "openinference-instrumentation-langchain>=0.1.53",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "playwright>=1.55.0",
    "plotly>=6.3.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pymysql>=1.1.2",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.7.0",
    "requests>=2.32.5",
    "retry>=0.9.2",
    "sqlalchemy>=2.0.43",
    "tiktoken>=0.11.0",
    "uvicorn>=0.35.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
