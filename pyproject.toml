    "langchain>=1.0.2",
    "langchain-community>=0.4.1",
    "langchain-localai>=1.0.0",
    "langchain-openai>=1.0.1",
    "langfuse>=3.9.2",
    "langgraph>=1.0.1",
    "langgraph-checkpoint-mysql[aiomysql]>=2.0.17",
    "loguru>=0.7.3",
    "markitdown>=0.1.3",
    "modelscope>=1.32.0",
    "numpy>=2.2.6",
    "openai>=2.6.0",
    "openinference-instrumentation-langchain>=0.1.53",
