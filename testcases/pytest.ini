[pytest]
# 测试路径
testpaths = testcases

# Python文件模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试
    requires_db: 需要数据库的测试

# 异步测试
asyncio_mode = auto

# 最小Python版本
minversion = 3.9
