# 淘沙分析平台配置文件

# 应用信息
app:
  name: "淘沙分析平台"
  version: "0.1.0"
  debug: true

# 查询引擎配置
query_engine:
  dir: "./database"
  service_type: "duckdb"  # duckdb 或 spark
  duckdb_path: "./database/taosha.duckdb"

# 业务数据配置
taosha_db:
  db_type: "sqlite"  # sqlite 或 mysql

  # SQLite配置（默认）
  sqlite_path: "./database/metadata.db"

  # MySQL配置（当db_type为mysql时使用）
  mysql:
    host: "localhost"
    port: 3306
    database: "taosha_metadata"
    user: "root"
    password: ""
    charset: "utf8mb4"

# OpenAI配置
openai:
  api_key: ""  # 从环境变量 OPENAI_API_KEY 读取
  base_url: ""  # 从环境变量 OPENAI_BASE_URL 读取
  model: "kimi-k2-0905-preview"
  temperature: 0.1

# Embedding配置 (用于ChromaDB向量存储)
embedding:
  type: "local"  # remote 或 local
  api_key: ""  # remote需配置环境变量 EMBEDDING_API_KEY
  base_url: ""  # remote需配置环境变量 EMBEDDING_BASE_URL
  model_path: "./database/Qwen3-Embedding-0___6B"  # local需配置 本地模型路径
  device: "cpu"  # 推理设备: cpu/cuda
  cache_size: 1000  # embedding缓存大小
  model: "Qwen/Qwen3-Embedding-0.6B"  # OpenAI embedding模型名称
  dimensions: 1024  # embedding维度

# 向量存储配置
vector_store:
  store_type: "qdrant"  # chromadb 或 qdrant
  collection_name: "taosha_knowledge"
  persist_dir: "./database/chromadb"
  
  # Qdrant配置
  qdrant:
    mode: "remote"  # memory 或 remote
    # 远程Qdrant配置（当mode为remote时使用）
    url: ""  # 从环境变量 QDRANT_URL 读取
    api_key: ""  # 从环境变量 QDRANT_API_KEY 读取
    timeout: 30  # 连接超时时间（秒）
    # 可选：TLS配置
    verify: true  # 是否验证HTTPS证书
    # 可选：代理配置
    grpc_port: 6334  # gRPC端口
    # 可选：认证配置
    prefer_grpc: false  # 是否优先使用gRPC

tracing:
  tracing_type: "phoenix"  # phoenix 或 langfuse
  phoenix_work_dir: "./database/"
  phoenix_port: "7788"
  langfuse_host: "https://cloud.langfuse.com"
  langfuse_public_key: ""  # langfuse需配置环境变量 LANGFUSE_PUBLIC_KEY
  langfuse_secret_key: ""  # langfuse需配置环境变量 LANGFUSE_SECRET_KEY

# 日志配置
logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "7 days"
  compression: "gz"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  colorize: true
  backtrace: true
  diagnose: true
  # 日志文件配置
  files:
    app:
      path: "logs/app.log"
      level: "INFO"
    error:
      path: "logs/error.log"
      level: "ERROR"

# 元数据同步配置
metadata_sync:
  enabled: false  # 是否启用元数据同步
  
  # 源数据库连接配置
  source_db:
    host: "localhost"
    port: 3306
    database: "source_metadata"
    user: "root"
    password: ""
    charset: "utf8mb4"
    connection_timeout: 30  # 连接超时时间（秒）
  
  # 同步SQL查询语句，必须返回以下列：table_name, table_comment, column_name, column_comment, column_type
  sync_sql: |
    SELECT
      t.TABLE_NAME AS table_name,
      t.TABLE_COMMENT AS table_comment,
      c.COLUMN_NAME AS column_name,
      c.COLUMN_COMMENT AS column_comment,
      c.COLUMN_TYPE AS column_type
    FROM information_schema.TABLES t
    JOIN information_schema.COLUMNS c ON t.TABLE_NAME = c.TABLE_NAME AND t.TABLE_SCHEMA = c.TABLE_SCHEMA
    WHERE t.TABLE_SCHEMA = '${database}'
      AND c.TABLE_SCHEMA = '${database}'
      AND t.TABLE_TYPE = 'BASE TABLE'
    ORDER BY t.TABLE_NAME, c.ORDINAL_POSITION
  
  # 同步选项
  options:
    case_sensitive: false  # 表名和字段名是否区分大小写
    max_retries: 3         # 最大重试次数
    retry_delay: 1.0       # 重试延迟（秒）

# 环境变量前缀
env_prefix: "TAOSHA_"