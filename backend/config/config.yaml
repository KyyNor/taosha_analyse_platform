# 淘沙分析平台配置文件

# 应用信息
app:
  name: "淘沙分析平台"
  version: "0.1.0"
  debug: true

# 查询引擎配置
query_engine:
  dir: "./database"
  service_type: "spark"  # duckdb 或 spark
  duckdb_path: "./database/taosha.duckdb"
  spark:
    jdbc_driver_class: 'org.apache.hive.jdbc.HiveDriver'
    jdbc_url: 'jdbc:hive2://125.1.129.81:10000'
    user_name: bdspk
    password: ''
  jdbc_driver_jar:
    - /data/taosha/taosha_analyse_platform/backend/jars/hadoop-common-2.3.0.jar
    - /data/taosha/taosha_analyse_platform/backend/jars/hive-jdbc-1.2.2-standalone.jar
    - /data/taosha/taosha_analyse_platform/backend/jars/trino-jdbc-407.jar

# 业务数据配置
taosha_db:
  db_type: "mysql"  # sqlite 或 mysql

  # SQLite配置（默认）
  sqlite_path: "./database/metadata.db"

  # MySQL配置（当db_type为mysql时使用）
  mysql:
    host: "125.1.129.75"
    port: 3306
    database: "taosha"
    user: "testUser"
    password: "Hx215079."
    charset: "utf8mb4"

# OpenAI配置
openai:
  api_key: "Hxb147258"  # 从环境变量 OPENAI_API_KEY 读取
  base_url: "http://125.1.129.158:51002/v1/"  # 从环境变量 OPENAI_BASE_URL 读取
  model: "Qwen3-Coder"
  temperature: 0.1

# Embedding配置 (用于ChromaDB向量存储)
embedding:
  type: "local"  # remote 或 local
  api_key: ""  # remote需配置环境变量 EMBEDDING_API_KEY
  base_url: ""  # remote需配置环境变量 EMBEDDING_BASE_URL
  model: "bge-base-zh"  # FastEmbed模型名称
  model_path: "/data/taosha/embedding_model_file"  # 模型路径
  dimensions: 768  # embedding维度
  pooling: "CLS" # 池化方式: CLS 或 MEAN (BGE、ms-marco-MiniLM为CLS，jina-embeddings-v2、all-MiniLM-L6-v2、nomic-embed-*为MEAN)
  reranker_model: "jina-reranker-v2_int8"

# 向量存储配置
vector_store:
  collection_name: "taosha_knowledge"

  # Qdrant配置
  qdrant:
    # 远程Qdrant配置（当mode为remote时使用）
    url: "http://125.1.129.158:50011"  # 从环境变量 QDRANT_URL 读取
    api_key: "Hx147258."  # 从环境变量 QDRANT_API_KEY 读取
    timeout: 60  # 连接超时时间（秒）

tracing:
  tracing_type: "phoenix"  # phoenix 或 langfuse
  phoenix_work_dir: "./database/"
  phoenix_port: "7788"
  langfuse_host: "https://cloud.langfuse.com"
  langfuse_public_key: ""  # langfuse需配置环境变量 LANGFUSE_PUBLIC_KEY
  langfuse_secret_key: ""  # langfuse需配置环境变量 LANGFUSE_SECRET_KEY

# 日志配置
logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "7 days"
  compression: "gz"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  colorize: true
  backtrace: true
  diagnose: true
  # 日志文件配置
  files:
    app:
      path: "logs/app.log"
      level: "INFO"
    error:
      path: "logs/error.log"
      level: "ERROR"

# 元数据同步配置
metadata_sync:
  enabled: false  # 是否启用元数据同步
  
  # 源数据库连接配置
  source_db:
    host: "125.1.129.121"
    port: 3306
    database: "data_factory"
    user: "whdb"
    password: "Hx215079_whdb"
    charset: "utf8mb4"
    connection_timeout: 30  # 连接超时时间（秒）
  
  # 同步SQL查询语句，必须返回以下列：table_name, table_comment, column_name, column_comment, column_type
  sync_sql: |
      SELECT 
        concat(t1.database_name,'.',t1.table_name) as table_name,
        t2.table_name as table_comment,
        t3.name as column_name,
        t4.name as column_comment,
        t3.col_type as column_type 
      FROM data_factory.metadata_entity_table t1
        left join data_factory.metadata_business_table t2
        on t1.busi_table_id  = t2.id 
        left join data_factory.metadata_entity_column t3
        on t1.id = t3.entity_table_id 
        left join data_factory.metadata_business_column t4
        on t3.busi_col_id = t4.id
      where t1.data_source_id = '1'
      and t1.table_status = '1'
  
  # 同步选项
  options:
    case_sensitive: false  # 表名和字段名是否区分大小写
    max_retries: 3         # 最大重试次数
    retry_delay: 1.0       # 重试延迟（秒）

# 环境变量前缀
env_prefix: "TAOSHA_"
