# 淘沙分析平台配置文件

# 应用信息
app:
  name: "淘沙分析平台"
  version: "0.1.0"
  debug: true

# 查询引擎配置
query_engine:
  dir: "./database"
  service_type: "duckdb"  # duckdb 或 spark
  duckdb_path: "./database/taosha.duckdb"

# 元数据配置
taosha_db:
  db_type: "sqlite"  # sqlite 或 mysql

  # SQLite配置（默认）
  sqlite_path: "./database/metadata.db"

  # MySQL配置（当db_type为mysql时使用）
  mysql:
    host: "localhost"
    port: 3306
    database: "taosha_metadata"
    user: "root"
    password: ""
    charset: "utf8mb4"

# OpenAI配置
openai:
  api_key: ""  # 从环境变量 OPENAI_API_KEY 读取
  base_url: ""  # 从环境变量 OPENAI_BASE_URL 读取
  model: "kimi-k2-0905-preview"
  temperature: 0.1

# Embedding配置 (用于ChromaDB向量存储)
embedding:
  type: "local"  # remote 或 local
  api_key: ""  # remote需配置环境变量 EMBEDDING_API_KEY
  base_url: ""  # remote需配置环境变量 EMBEDDING_BASE_URL
  model_path: "./database/Qwen3-Embedding-0___6B"  # local需配置 本地模型路径
  device: "cpu"  # 推理设备: cpu/cuda
  cache_size: 1000  # embedding缓存大小
  model: "Qwen/Qwen3-Embedding-0.6B"  # OpenAI embedding模型名称
  dimensions: 1024  # embedding维度

# 向量存储配置
vector_store:
  store_type: "chromadb"  # chromadb 或 qdrant
  collection_name: "taosha_knowledge"
  persist_dir: "./database/chromadb"

# 日志配置
logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "7 days"
  compression: "gz"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  colorize: true
  backtrace: true
  diagnose: true
  # 日志文件配置
  files:
    app:
      path: "logs/app.log"
      level: "INFO"
    error:
      path: "logs/error.log"
      level: "ERROR"

# 环境变量前缀
env_prefix: "TAOSHA_"