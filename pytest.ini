[pytest]
testpaths = tests/backend/modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 自定义标记（统一声明所有模块的标记范围，防止 typos 静默失效）
markers =
    # 模块维度
    wt:       宽表增量同步测试
    rt:       实时指标半小时间隔测试
    alert:    多通知目标合并告警测试
    pcbin:    省市卡BIN维表测试
    hist:     历史模型分析趋势测试
    acr:      告警管控记录页面优化测试
    ind:      指标管理任务联动测试
    model:    风控模型配置开关测试
    qual:     代码质量专项测试

    # 质量维度
    ut:           仅单元测试（无 IO / 无 DB / 无 Network）
    slow:         执行耗时长（>1s，典型：真实 HTTP Mock）
    integration:  需要真实数据库或外部系统的测试
    e2e:          端到端测试（建议移至 tests/e2e/）
    skip_wait_refactor: 待代码重构后激活的测试（如 wide_table_sync 的 WT 场景）

asyncio_mode = auto