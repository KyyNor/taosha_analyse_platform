[pytest]
testpaths = tests/backend/modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers：防止拼写错误的 marker 名悄悄失效
strict_markers = true

# 自定义标记（统一声明所有模块的 marker 范围）
markers =
    # 模块维度
    wt:        宽表增量同步测试（wide_table_sync）
    rt:        实时指标半小时间隔测试（realtime_indicator）
    alert:     多通知目标合并告警测试（alert_notification）
    pcbin:     省市卡BIN维表测试（province_cardbin）
    hist:      历史模型分析趋势测试（history_trend）
    acr:       告警管控记录页面优化测试（alert_control_record_optimization）
    ind:       指标管理任务联动测试（indicator_management）

    # 质量维度
    ut:        仅单元测试（无 IO，无 DB，无 Network）
    slow:      执行耗时长（>1s，典型场景：真实 HTTP Mock）
    integration: 需要真实数据库或外部系统的测试
    e2e:       端到端测试（应移到 tests/e2e/ 目录）
    skip_refactor: 待代码重构后激活的测试（如 wide_table_sync 的 WT 场景）

asyncio_mode = auto